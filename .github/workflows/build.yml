name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Increase swap file to 10GB
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Configure Gradle mirrors
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/init.gradle << 'EOF'
        allprojects {
            buildscript {
                repositories {
                    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                    maven { url 'https://maven.aliyun.com/repository/google' }
                    google()
                    mavenCentral()
                }
            }
            repositories {
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK (ARM64, low memory)
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
      run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
