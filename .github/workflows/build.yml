name: Build Flutter APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clean old source (keep .github, .git, zip)
      run: |
        ZIP=$(ls loan_manager_v*.zip 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$ZIP" ]; then
          echo "Found $ZIP. Deleting old source..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP" \
            -exec rm -rf {} +
          echo "Old source deleted."
        fi

    - name: Extract Source ZIP
      run: |
        ZIP=$(ls loan_manager_v*.zip 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$ZIP" ]; then
          unzip -o "$ZIP" -d .
          if [ -d "loan_manager" ]; then
            cp -r loan_manager/* .
            rm -rf loan_manager
          fi
          rm "$ZIP"
          ls -la
        else
          echo "No loan_manager_v*.zip found" && exit 1
        fi

    - name: Increase swap file to 10GB
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install Android SDK packages and accept licenses
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "platforms;android-35" \
          "platforms;android-36" \
          "build-tools;34.0.0" \
          "build-tools;35.0.0" \
          "build-tools;36.0.0"
        sdkmanager --list_installed

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Point Flutter at the Android SDK
      run: |
        flutter config --android-sdk "$ANDROID_HOME"
        yes | flutter doctor --android-licenses > /dev/null || true
        flutter doctor -v

    - name: Install dependencies
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      run: flutter pub get

    - name: Generate code (build_runner)
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Build APK
      env:
        CI: "true"
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
      run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
