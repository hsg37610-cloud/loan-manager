name: Build Flutter APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clean old source (keep .github, .git, zip)
      run: |
        if [ -f "loan_manager_v5.zip" ]; then
          echo "V5 ZIP found. Deleting old source..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'loan_manager_v5.zip' \
            -exec rm -rf {} +
          echo "Old source deleted."
        fi

    - name: Extract Source ZIP
      run: |
        if [ -f "loan_manager_v5.zip" ]; then
          unzip -o loan_manager_v5.zip -d .
          if [ -d "loan_manager" ]; then
            cp -r loan_manager/* .
            rm -rf loan_manager
          fi
          rm loan_manager_v5.zip
          ls -la
        fi

    # ⚠️ این مرحله جدید است: اصلاح خودکار خطاهای سینتکس ChatGPT
    - name: Fix ChatGPT Syntax Errors
      run: |
        python3 -c "
        import re
        
        # 1. حذف پارامتر allowMultiple از loan_list_screen.dart
        file1 = 'lib/features/ledger/presentation/loan_list_screen.dart'
        with open(file1, 'r') as f:
            content = f.read()
        content = content.replace('allowMultiple: false,', '')
        with open(file1, 'w') as f:
            f.write(content)
            
        # 2. اصلاح رشته Regex در excel_import_service.dart
        file2 = 'lib/features/import/data/excel_import_service.dart'
        with open(file2, 'r') as f:
            lines = f.readlines()
        for i, line in enumerate(lines):
            if 'final dimension = RegExp' in line:
                lines[i] = '        final dimension = RegExp(r\"\"\"<dimension\\\\b[^>]*\\\\bref=[\"\\']([^\"\\']+)[\"\\']\"\"\").firstMatch(xml);\\n'
        with open(file2, 'w') as f:
            f.writelines(lines)
        "
        echo "Syntax errors fixed successfully."

    - name: Increase swap file to 10GB
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      run: flutter pub get

    - name: Generate code (build_runner)
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
      run: dart run build_runner build --delete-conflicting-outputs || echo "build_runner warning (non-fatal)"

    - name: Build APK
      env:
        CI: "true"
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
      run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
