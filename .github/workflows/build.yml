name: Build Flutter APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clean old source (keep .github, .git, zip)
      run: |
        if [ -f "loan_manager_updated.zip" ]; then
          echo "Updated ZIP found. Deleting old source..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'loan_manager_updated.zip' \
            -exec rm -rf {} +
          echo "Old source deleted."
        fi

    - name: Extract Source ZIP
      run: |
        if [ -f "loan_manager_updated.zip" ]; then
          unzip -o loan_manager_updated.zip -d .
          if [ -d "loan_manager" ]; then
            cp -r loan_manager/* .
            rm -rf loan_manager
          fi
          rm loan_manager_updated.zip
          ls -la
        fi

    # Safety net: if the manifest is missing from the zip, recreate it
    - name: Recreate Missing AndroidManifest.xml (if needed)
      run: |
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          echo "Manifest missing. Creating..."
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application
                  android:label="مدیریت وام"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
        else
          echo "Manifest exists in zip. Skipping."
        fi

    - name: Increase swap file to 10GB
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      run: flutter pub get

    - name: Generate code (build_runner)
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
      run: dart run build_runner build --delete-conflicting-outputs || echo "build_runner warning (non-fatal)"

    - name: Build APK
      env:
        CI: "true"
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
      run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
