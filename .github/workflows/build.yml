name: Build Flutter APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clean old source (keep .github, .git, zip)
      run: |
        if [ -f "loan_manager_fixed.zip" ]; then
          echo "ZIP found. Deleting old source..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'loan_manager_fixed.zip' \
            -exec rm -rf {} +
          echo "Old source deleted."
        else
          echo "No ZIP found. Skipping cleanup (safe mode)."
        fi

    - name: Extract Source ZIP and Apply Patches
      run: |
        if [ -f "loan_manager_fixed.zip" ]; then
          echo "Extracting..."
          unzip -o loan_manager_fixed.zip -d .
          if [ -d "loan_manager_fixed" ]; then
            cp -r loan_manager_fixed/* .
            rm -rf loan_manager_fixed
          fi
          rm loan_manager_fixed.zip

          echo "Applying automatic patches..."
          # Fix file_picker 13.x API (remove .platform)
          sed -i 's/FilePicker\.platform\.pickFiles/FilePicker.pickFiles/g' lib/features/ledger/presentation/loan_list_screen.dart
          echo "Patches applied."
          ls -la
        fi

    - name: Increase swap file to 10GB
      run: |
        sudo swapoff -a
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      run: flutter pub get

    - name: Generate code (build_runner)
      env:
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
      run: dart run build_runner build --delete-conflicting-outputs || echo "build_runner warning (non-fatal)"

    - name: Build APK
      env:
        CI: "true"
        PUB_HOSTED_URL: "https://pub.flutter-io.cn"
        FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
      run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
